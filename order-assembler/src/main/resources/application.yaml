spring:
  application:
    name: order-assembler
  kafka:
    bootstrap-servers: localhost:9092
    streams:
      application-id: order-assembler
      properties:
        processing.guarantee: exactly_once_v2
        commit.interval.ms: 1000
        ensure.explicit.internal.resource.naming: true
        topology.optimization: all

order-assembler:
  topics:
    orders: app.public.orders
    order-items: app.public.order_items
    order-events: order_events
